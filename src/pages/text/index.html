<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文字模块 - Acan 资料站</title>
    <link rel="stylesheet" href="../../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/page-shell.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">Module / Text</p>
          <h1>文字模块</h1>
        </div>
        <a class="ghost-link" href="../landing/">返回先导页</a>
      </header>

      <nav class="module-links" aria-label="模块切换">
        <a class="module-link active" href="../text/">
          <span class="module-icon">T</span>
          <span><strong>文字模块</strong><small>观点、设定、记录</small></span>
        </a>
        <a class="module-link" href="../image/">
          <span class="module-icon">I</span>
          <span><strong>图片模块</strong><small>插图、截图、素材</small></span>
        </a>
        <a class="module-link" href="../video/">
          <span class="module-icon">V</span>
          <span><strong>视频模块</strong><small>片段、回放、剪辑</small></span>
        </a>
      </nav>

      <section class="content-stage">
        <header class="stage-header">
          <h2 id="stage-title"></h2>
          <p id="stage-description"></p>
        </header>
        <div id="stage-grid" class="stage-grid"></div>
      </section>
    </main>
    <script src="./page.js" type="module"></script>
  </body>
</html>
