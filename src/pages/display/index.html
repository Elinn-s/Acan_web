<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>展示页 - Acan 资料站</title>
    <link rel="stylesheet" href="../../shared/styles/tokens.css" />
    <link rel="stylesheet" href="../../shared/styles/base.css" />
    <link rel="stylesheet" href="../../shared/styles/page-shell.css" />
  </head>
  <body>
    <main class="shell">
      <header class="page-header">
        <div>
          <p class="page-kicker">Module / Display</p>
          <h1>展示页</h1>
        </div>
        <a class="ghost-link" href="../landing/">返回先导页</a>
      </header>

      <nav class="module-links" aria-label="模块切换">
        <a class="module-link active" href="../display/">
          <span class="module-icon">D</span>
          <span><strong>展示页</strong><small>概览与入口</small></span>
        </a>
        <a class="module-link" href="../text/">
          <span class="module-icon">T</span>
          <span><strong>文字页</strong><small>观点、设定、记录</small></span>
        </a>
        <a class="module-link" href="../image/">
          <span class="module-icon">I</span>
          <span><strong>图片页</strong><small>插图、截图、素材</small></span>
        </a>
        <a class="module-link" href="../video/">
          <span class="module-icon">V</span>
          <span><strong>视频页</strong><small>片段、回放、剪辑</small></span>
        </a>
      </nav>

      <section class="content-stage">
        <header class="stage-header">
          <h2>站点总览</h2>
          <p>这是展示页，后续可放角色简介、统计信息、推荐内容和快速入口。</p>
        </header>
        <div class="stage-grid">
          <article class="item-card">
            <h3>快速入口</h3>
            <p>从这里一键跳转到文字、图片、视频模块。</p>
          </article>
          <article class="item-card">
            <h3>近期更新</h3>
            <p>后续可展示最近更新时间、更新数量和版本说明。</p>
          </article>
          <article class="item-card">
            <h3>角色状态</h3>
            <p>可扩展展示角色设定、标签、关系图等信息。</p>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
