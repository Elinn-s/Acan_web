<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="GLOSS placeholder 3">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f7f2ec"/>
      <stop offset="1" stop-color="#efe6dd"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d98b6a" stop-opacity=".5"/>
      <stop offset="1" stop-color="#efe6dd"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="weave">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.05" numOctaves="3" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="27"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <rect width="1200" height="1200" fill="#f7f2ec"/>
  <circle cx="600" cy="624" r="504" fill="#efe6dd" opacity=".55"/>
  <circle cx="600" cy="624" r="504" fill="none" stroke="#d98b6a" stroke-width="14" opacity="0.85"/><circle cx="600" cy="624" r="384" fill="none" stroke="#f0c9c0" stroke-width="14" opacity="0.72"/><circle cx="600" cy="624" r="264" fill="none" stroke="#d98b6a" stroke-width="14" opacity="0.59"/><circle cx="600" cy="624" r="144" fill="none" stroke="#f0c9c0" stroke-width="14" opacity="0.46"/>
  <circle cx="600" cy="624" r="72" fill="#2b2724"/>
  <rect x="0" y="624" width="1200" height="7" fill="#2b2724" opacity=".3"/>
  <rect width="1200" height="1200" fill="url(#vig)"/>
  <rect width="1200" height="1200" filter="url(#grain)" opacity=".14" style="mix-blend-mode:overlay"/>
  <text x="54" y="1146" font-family="Helvetica, Arial, sans-serif"
        font-size="38" letter-spacing="14"
        fill="#2b2724" opacity=".5">GLOSS / 03</text>
</svg>
