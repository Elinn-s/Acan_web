<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" role="img" aria-label="DEV placeholder 4">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4d3520"/>
      <stop offset="1" stop-color="#241709"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a05b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#241709"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="17"/></filter>
    <filter id="weave">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.05" numOctaves="3" seed="24"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="40"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <rect width="1000" height="1500" fill="url(#sky)"/>
  <rect width="1000" height="1500" fill="#d9a05b" opacity=".5" filter="url(#weave)" style="mix-blend-mode:overlay"/>
  <rect x="120" y="180" width="760" height="1140" fill="none" stroke="#a35a35" stroke-width="4" opacity=".5"/>
  <circle cx="300" cy="570" r="200" fill="#efe3cd" opacity=".22" filter="url(#soft)"/>
  <rect width="1000" height="1500" fill="url(#vig)"/>
  <rect width="1000" height="1500" filter="url(#grain)" opacity=".14" style="mix-blend-mode:overlay"/>
  <text x="45" y="1455" font-family="Helvetica, Arial, sans-serif"
        font-size="32" letter-spacing="12"
        fill="#a35a35" opacity=".5">DEV / 04</text>
</svg>
