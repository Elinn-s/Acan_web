<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" role="img" aria-label="DEV placeholder 2">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#4d3520"/>
      <stop offset="1" stop-color="#241709"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a05b" stop-opacity=".5"/>
      <stop offset="1" stop-color="#241709"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="soft2"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="weave">
      <feTurbulence type="turbulence" baseFrequency="0.012 0.05" numOctaves="3" seed="10"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="14"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <circle cx="384" cy="264" r="360" fill="#d9a05b" opacity=".3" filter="url(#soft)"/>
  <circle cx="1312" cy="936" r="312" fill="#efe3cd" opacity=".2" filter="url(#soft)"/>
  <g filter="url(#soft2)" opacity=".92">
    <ellipse cx="800" cy="360" rx="208" ry="156" fill="#241709"/>
    <path d="M320 1224 Q800 456 1280 1224 Z" fill="#241709"/>
  </g>
  <ellipse cx="704" cy="336" rx="80" ry="84" fill="#efe3cd" opacity=".18" filter="url(#soft)"/>
  <rect width="1600" height="1200" fill="url(#vig)"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity=".14" style="mix-blend-mode:overlay"/>
  <text x="72" y="1146" font-family="Helvetica, Arial, sans-serif"
        font-size="38" letter-spacing="14"
        fill="#a35a35" opacity=".5">DEV / 02</text>
</svg>
