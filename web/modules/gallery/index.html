<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片 — 火山口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="gallery-header">
    <a href="../../index.html" class="back-btn">
      <span class="back-arrow">←</span>
      <span>返回</span>
    </a>
    <h1 class="gallery-title">图片资料站</h1>
    <div class="header-spacer"></div>
  </header>

  <!-- 分类标签（由 JS 生成） -->
  <nav class="category-nav" id="categoryNav"></nav>

  <!-- 图片网格（由 JS 生成） -->
  <main class="gallery-main">
    <div class="image-grid" id="imageGrid"></div>
  </main>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-overlay" id="lightboxOverlay"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭">✕</button>
      <button class="lightbox-prev"  id="lightboxPrev"  aria-label="上一张">‹</button>
      <img    class="lightbox-img"   id="lightboxImg"   src="" alt="预览图">
      <button class="lightbox-next"  id="lightboxNext"  aria-label="下一张">›</button>
      <p class="lightbox-caption"    id="lightboxCaption"></p>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
