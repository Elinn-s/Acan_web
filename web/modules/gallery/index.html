<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片 — 火山口</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

  <!-- 顶部导航栏 -->
  <header class="gallery-header">
    <a href="../../index.html" class="back-btn">
      <span class="back-arrow">←</span>
      <span>返回</span>
    </a>
    <h1 class="gallery-title" id="galleryTitle"></h1>

    <!-- 按日期跳转（下拉选年/月/日，只在配置了日历的分类下显示，由 JS 控制 hidden） -->
    <div class="header-actions">
      <div class="calendar-widget" id="calendarWidget" hidden>
        <button type="button" class="calendar-toggle" id="calendarToggle" aria-expanded="false" aria-label="按日期跳转">📅</button>
        <div class="calendar-panel" id="calendarPanel" hidden>
          <p class="calendar-panel-title">按日期跳转</p>
          <div class="calendar-picker">
            <select id="calendarYearSelect"  aria-label="年"></select>
            <select id="calendarMonthSelect" aria-label="月"></select>
            <select id="calendarDaySelect"   aria-label="日"></select>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- 分类标签（由 JS 生成） -->
  <nav class="category-nav" id="categoryNav"></nav>

  <!-- 图片（由 JS 生成；有日历的分类会按日期分组，类似相册时间线） -->
  <main class="gallery-main">
    <div class="gallery-layout">
      <!-- 左侧专栏筛选（只在配置了 filters 的分类下显示，由 JS 控制 hidden） -->
      <aside class="filter-sidebar" id="filterSidebar" hidden></aside>
      <div class="image-groups" id="imageGrid"></div>
    </div>
  </main>

  <!-- 灯箱 -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-overlay" id="lightboxOverlay"></div>
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose" aria-label="关闭">✕</button>
      <button class="lightbox-prev"  id="lightboxPrev"  aria-label="上一张">‹</button>
      <img    class="lightbox-img"   id="lightboxImg"   src="" alt="预览图">
      <button class="lightbox-next"  id="lightboxNext"  aria-label="下一张">›</button>
      <p class="lightbox-caption"    id="lightboxCaption"></p>
    </div>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
