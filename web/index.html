<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Acan · 电子书柜</title>
  <meta name="description" content="Acan 杂志电子书柜">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="stylesheet" href="css/zoom.css">
</head>
<body>
  <header class="site-head">
    <a class="wordmark" href="#" aria-label="返回书柜">ACAN</a>
    <p>Magazine archive</p>
  </header>

  <main>
    <section class="library" id="library" aria-labelledby="library-title">
      <div class="library__head">
        <div>
          <p class="eyebrow">COLLECTION</p>
          <h1 id="library-title">电子书柜</h1>
        </div>
        <p class="library__count" id="library-count"></p>
      </div>
      <div class="book-grid" id="book-grid" role="list"></div>
      <p class="fallback" id="fallback" hidden></p>
    </section>

    <section class="detail" id="detail" aria-labelledby="detail-title" hidden>
      <button class="back" id="back" type="button" aria-label="返回书柜">
        <span aria-hidden="true">←</span> 返回书柜
      </button>
      <div class="detail__layout">
        <div class="detail__cover" id="detail-cover"></div>
        <div class="detail__content">
          <article class="meta" id="detail-meta"></article>
          <section class="gallery" aria-labelledby="gallery-title">
            <div class="gallery__head">
              <h3 id="gallery-title">全部图片</h3>
              <span id="gallery-count"></span>
            </div>
            <div class="thumb-grid" id="thumb-grid"></div>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="查看大图" hidden>
    <div class="zoom__view" id="zoom-view">
      <img class="zoom__img" id="zoom-img" alt="" draggable="false">
    </div>
    <div class="zoom__bar">
      <button class="zoom__step" id="zoom-prev" type="button" aria-label="上一张">←</button>
      <span class="zoom__count" id="zoom-count"></span>
      <button class="zoom__step" id="zoom-next" type="button" aria-label="下一张">→</button>
    </div>
    <p class="zoom__hint">
      <span class="zoom__hint--fine">滚轮缩放 · 拖动查看 · 双击复原</span>
      <span class="zoom__hint--coarse">双指缩放 · 单指拖动 · 左右滑动换图</span>
    </p>
    <button class="zoom__close" id="zoom-close" type="button" aria-label="关闭大图">×</button>
  </div>

  <noscript><p class="fallback">这个电子书柜需要启用 JavaScript。</p></noscript>
  <script defer src="js/app.js"></script>
</body>
</html>
